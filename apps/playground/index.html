<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>@bloxwap/chart playground</title>
  <link rel="icon" href="data:," />
  <style>
    @font-face { font-family: 'Geist'; src: url('../assets/fonts/Geist-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Geist'; src: url('../assets/fonts/Geist-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'Geist Mono'; src: url('../assets/fonts/GeistMono-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Geist Mono'; src: url('../assets/fonts/GeistMono-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    /* The app only lays out regions and sets brand tokens; header, toolbar and on-chart styling ship with chart-ts/ui. */
    html, body { margin: 0; height: 100%; background: #0a0a0a; }
    body.light { background: #f5f7fa; }
    #app { display: flex; height: 100vh; height: 100dvh; }
    #main { flex: 1; min-width: 0; display: flex; flex-direction: column; margin: 6px 6px 6px 0; border-radius: 12px; overflow: hidden; background: #171717; }
    body.light #main { background: #ffffff; }
    #header { flex: none; min-width: 0; }
    /* Wide: the control rail carries the header's controls, so the plot starts at the top of the card. */
    @media (min-width: 600px) { #header { display: none; } }
    #ctrl-rail { flex: none; display: flex; }
    #stage { position: relative; flex: 1; min-height: 0; }
    #tools { flex: none; width: 52px; overflow: hidden; transition: width 240ms cubic-bezier(0.2, 0.8, 0.2, 1); }
    #tools.collapsed { width: 0; }
    #tools > nav { transition: transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 180ms ease-out; }
    #tools.collapsed > nav { transform: translateX(-100%); opacity: 0; }
    @media (prefers-reduced-motion: reduce) { #tools, #tools > nav { transition: none; } }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    /* bloxwap.pro chrome on dark for the rails, menus and dialogs: zero-stroke surfaces, #262626 hover fill, #00ff3f accent.
       The header takes BLOXWAP_HEADER_THEME instead, which clears itself on light. */
    body:not(.light) .cts-theme:not(.cts-light) {
      --cts-edge: transparent; --cts-panel-raised: #262626; --cts-accent: #00ff3f;
      --cts-accent-soft: #262626; --cts-on-accent: #0a0a0a;
    }
    /* Pill header buttons on light too (the dark tokens already round them). */
    .cts-header { --cts-header-radius: 9999px; }
    /* A header too wide for its bar compacts (timeframes → dropdown), then wraps onto a second row. */
    .cts-header.cts-header-compact { flex-wrap: wrap; height: auto; min-height: 40px; padding-block: 6px; row-gap: 4px; }
    .app-header-controls { display: flex; align-items: center; gap: 2px; }
    .app-header-controls .cts-btn { width: 28px; height: 28px; border-radius: 9999px; }
    .app-header-controls .cts-btn svg { width: 18px; height: 18px; }
    .app-header-controls .cts-caret { display: none; }

    /* History paging and feed notices, over the top of the plot. */
    #feed-status {
      position: absolute; z-index: 7; top: 36px; left: 50%; transform: translateX(-50%); padding: 4px 10px;
      border-radius: 9999px; background: #262626; color: #fafafa; font: 500 12px/1.4 'Geist', system-ui, sans-serif;
      pointer-events: none; opacity: 0; transition: opacity 160ms ease-out;
    }
    body.light #feed-status { background: #f0f3fa; color: #131722; }
    #feed-status.shown { opacity: 1; }

    /* Narrow screens: the chart takes the width, rail controls move into the header, the drawing rail starts collapsed. */
    @media (max-width: 599px) {
      #ctrl-rail { display: none; }
      #main { margin: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="ctrl-rail"></div>
    <div id="tools"></div>
    <main id="main">
      <div id="header"></div>
      <div id="stage"><canvas id="chart"></canvas><div id="feed-status" role="status" aria-live="polite"></div></div>
    </main>
  </div>

  <script type="module">
    import {
      defineConfig, presetChartTheme, createFootprintSeries, createDeltaIndicator, createCvdIndicator, attachRangeProfile, attachInlineBook,
    } from '../dist/index.js';
    import { createDatafeedChart, datafeedFootprintSource, bucketStartMs } from '../dist/datafeed/index.js';
    import {
      createDrawingToolbar, createChartSettings, createIndicatorsDialog, createThemeControl, createFrameScheduler,
      createChartHeader, createControlRail, DEFAULT_TIMEFRAMES, el, iconButton, setButtonIcon,
      menuItem, menuLabel, menuSeparator, startCountdownTicker,
    } from '../dist/ui/index.js';
    import { BLOXWAP_HEADER_THEME } from '../dist/ui/index.js';

    const $ = (id) => document.getElementById(id);
    const COIN = 'BTC';
    const WALK = 'Random walk';
    const GAPS = 'Walk with gaps';
    const TF_LABELS = new Map(DEFAULT_TIMEFRAMES.map((tf) => [tf.intervalMs, tf.label]));
    const labelOf = (ms) => TF_LABELS.get(ms) ?? `${Math.round(ms / 60_000)}m`;

    // ---------------- history sources: Hyperliquid, or a local random walk ----------------
    // Hyperliquid candleSnapshot: bars opening in [startTime, endTime], at most 5000 rows, only the latest
    // ~5000 candles per interval. Every interval is epoch-aligned (1w opens Thursday, 1M spans 30 days).
    const toCandle = (k) => ({ time: k.t / 1000, open: +k.o, high: +k.h, low: +k.l, close: +k.c, volume: +k.v });
    async function fetchHyperliquid({ symbol, intervalMs, fromMs, toMs, signal }) {
      const res = await fetch('https://api.hyperliquid.xyz/info', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, signal,
        body: JSON.stringify({ type: 'candleSnapshot', req: { coin: symbol, interval: labelOf(intervalMs), startTime: fromMs, endTime: toMs } }),
      });
      if (!res.ok) throw new Error(`Hyperliquid candleSnapshot failed: ${res.status}`);
      return (await res.json()).map(toCandle);
    }

    // A deterministic walk per symbol and interval with a finite history (5000 bars, like Hyperliquid;
    // 1500 slots with ~15% missing for the gaps dataset), served through the same paging datafeed.
    const walks = new Map();
    const seeded = (seed) => () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    const hash = (text) => [...text].reduce((h, c) => (h * 31 + c.charCodeAt(0)) & 0x7fffffff, 7);
    const walkStep = (intervalMs) => (intervalMs >= 86_400_000 ? 4 : intervalMs >= 3_600_000 ? 1.6 : 0.6);
    function walkBar(rand, timeMs, open, step) {
      const close = Math.max(1, open + (rand() - 0.48) * step);
      return {
        time: timeMs / 1000, open, close, volume: Math.round(500 + rand() * 4500),
        high: Math.max(open, close) + rand() * step * 0.4, low: Math.min(open, close) - rand() * step * 0.4,
      };
    }
    function walkFor(symbol, intervalMs) {
      const key = `${symbol}@${intervalMs}`;
      const now = bucketStartMs(Date.now(), intervalMs);
      let walk = walks.get(key);
      if (!walk) {
        const rand = seeded(hash(key)), step = walkStep(intervalMs), gaps = symbol === GAPS;
        const bars = [];
        let price = 100;
        for (let i = (gaps ? 1500 : 5000) - 1; i >= 0; i--) {
          const bar = walkBar(rand, now - i * intervalMs, price, step);
          price = bar.close;
          if (!(gaps && i > 0 && rand() < 0.15)) bars.push(bar);
        }
        walks.set(key, walk = { bars, rand, step });
      }
      // Revisiting later continues from the last bar up to now, so no bucket goes missing.
      for (let t = walk.bars.at(-1).time * 1000 + intervalMs; t <= now; t += intervalMs) {
        walk.bars.push(walkBar(walk.rand, t, walk.bars.at(-1).close, walk.step));
      }
      return walk.bars;
    }
    async function fetchSynthetic({ symbol, intervalMs, fromMs, toMs }) {
      return walkFor(symbol, intervalMs).filter((c) => c.time * 1000 >= fromMs && c.time * 1000 <= toMs);
    }

    // ---------------- depth books: Hyperliquid for BTC, a synthetic book for the walks ----------------
    // Hyperliquid pushes whole l2Book snapshots, so each one becomes a sequenced diff against the previous
    // (size 0 removes a level). A snapshot read returns the latest pushed book, so the diffs line up with it.
    // A subscription returns at most 20 levels a side, so the book stitches two precisions: fine levels sized to
    // the timeframe (nSigFigs 4/3 ≈ $10/$100 at BTC prices) near the price, then coarse buckets (one step coarser)
    // out to ±20 of those, for depth across the whole visible range.
    let hlBook = null, hlSeq = 0, hlFigs = 4;
    /** The latest raw book per precision, tagged with its nSigFigs. */
    let hlFine = null, hlCoarse = null;
    /** Hyperliquid's full-precision best bid/offer (the `bbo` feed): the true spread under aggregated levels. */
    let hlBbo = null;
    const hlFigsFor = (intervalMs) => (intervalMs <= 300_000 ? 4 : 3);
    const hlSide = (levels) => levels.map((l) => [+l.px, +l.sz]);
    /** Bucket size of `figs` significant figures at `price` (e.g. 3 → $100 at $83k). */
    const hlStep = (price, figs) => 10 ** (Math.floor(Math.log10(price)) + 1 - figs);
    function hlRaw(levels, figs, time) {
      return { figs, bids: hlSide(levels[0]), asks: hlSide(levels[1]), time };
    }
    /**
     * Fine levels, then each coarse bucket beyond them. Buckets round bids down ([px, px + step)) and asks up
     * ((px - step, px]); the bucket straddling the fine edge keeps only the size the fine levels don't cover.
     */
    function hlStitch(fine, coarse) {
      if (coarse === null || coarse.figs !== fine.figs - 1) return { figs: fine.figs, bids: fine.bids, asks: fine.asks, time: fine.time };
      const price = fine.bids[0]?.[0] ?? fine.asks[0]?.[0];
      const step = price > 0 ? hlStep(price, coarse.figs) : 0;
      const side = (levels, buckets, bid) => {
        if (levels.length === 0 || step === 0) return levels;
        const edge = levels.at(-1)[0], out = levels.slice();
        for (const [px, size] of buckets) {
          if (bid ? px >= edge : px <= edge) continue; // wholly inside the fine range
          const inside = levels.reduce((sum, [p, s]) => ((bid ? p >= px && p < px + step : p > px - step && p <= px) ? sum + s : sum), 0);
          const rest = +(size - inside).toFixed(8);
          if (rest > 0) out.push([px, rest]);
        }
        return out;
      };
      return { figs: fine.figs, bids: side(fine.bids, coarse.bids, true), asks: side(fine.asks, coarse.asks, false), time: Math.max(fine.time, coarse.time) };
    }
    async function fetchHyperliquidDepth({ signal }) {
      const figs = hlFigs = hlFigsFor(datafeed.intervalMs ?? 900_000);
      if (hlBook === null || hlBook.figs !== figs) {
        const read = async (nSigFigs) => {
          const res = await fetch('https://api.hyperliquid.xyz/info', {
            method: 'POST', headers: { 'content-type': 'application/json' }, signal,
            body: JSON.stringify({ type: 'l2Book', coin: COIN, nSigFigs }),
          });
          if (!res.ok) throw new Error(`Hyperliquid l2Book failed: ${res.status}`);
          const { levels, time } = await res.json();
          return hlRaw(levels, nSigFigs, time);
        };
        const [fine, coarse] = await Promise.all([read(figs), read(figs - 1)]);
        // A push at this precision during the read is newer: keep it.
        if (hlBook === null || hlBook.figs !== figs) {
          hlFine = fine;
          hlCoarse = coarse;
          hlBook = hlStitch(fine, coarse);
        }
      }
      return { lastUpdateId: hlSeq, bids: hlBook.bids, asks: hlBook.asks, time: hlBook.time };
    }
    function hlDiff(prev, next) {
      const keep = new Set(next.map(([p]) => p));
      return next.concat(prev.filter(([p]) => !keep.has(p)).map(([p]) => [p, 0]));
    }
    /** Pushes arrive untagged: a book whose every price sits on the coarse step is the coarse subscription's. */
    function onHyperliquidBook(data, figs) {
      if (figs !== hlFigs) return; // a superseded precision's push
      const levels = data.levels[0].concat(data.levels[1]);
      if (levels.length === 0) return;
      const coarseStep = hlStep(+levels[0].px, figs - 1);
      const coarse = levels.every((l) => Math.abs(+l.px / coarseStep - Math.round(+l.px / coarseStep)) < 1e-9);
      const raw = hlRaw(data.levels, coarse ? figs - 1 : figs, data.time);
      if (coarse) hlCoarse = raw;
      else hlFine = raw;
      if (hlFine === null || hlFine.figs !== figs) return; // the coarse half alone is no book yet
      const next = hlStitch(hlFine, hlCoarse);
      const prev = hlBook !== null && hlBook.figs === figs ? hlBook : null;
      // Without a same-precision base the diff is unknown: skip an id so the push gaps and the book resyncs.
      if (prev === null) hlSeq += 1;
      hlBook = next;
      hlSeq += 1;
      datafeed.pushDepth({ firstUpdateId: hlSeq, finalUpdateId: hlSeq, time: next.time,
        bids: hlDiff(prev?.bids ?? [], next.bids), asks: hlDiff(prev?.asks ?? [], next.asks) }, COIN);
    }
    // A walk symbol's book: 50 levels per side around the last close, mutated by synthDepthDelta.
    const synthBooks = new Map();
    function synthBook(symbol) {
      const existing = synthBooks.get(symbol);
      if (existing) return existing;
      const mid = chart.getData().at(-1)?.close ?? 100;
      const tick = Math.max(0.01, +(mid * 0.0002).toPrecision(1));
      const rand = seeded(hash(`${symbol}@depth`));
      const side = (dir) => Array.from({ length: 50 }, (_, i) => [+(mid + dir * (i + 1) * tick).toFixed(6), +(rand() * 8 + 0.05).toFixed(3)]);
      const depth = { seq: 0, mid, tick, rand, bids: side(-1), asks: side(1) };
      synthBooks.set(symbol, depth);
      return depth;
    }
    async function fetchSynthDepth(symbol) {
      const depth = synthBook(symbol);
      return { lastUpdateId: depth.seq, bids: depth.bids.slice(), asks: depth.asks.slice() };
    }
    // A few random levels per tick; a drift past 20 ticks recenters by forcing a sequence gap, so the
    // depth manager resyncs from a fresh snapshot (its Binance-style gap repair, exercised locally).
    function synthDepthDelta(symbol) {
      const depth = synthBooks.get(symbol);
      if (!depth || symbol === null) return;
      const mid = chart.getData().at(-1)?.close ?? depth.mid;
      if (Math.abs(mid - depth.mid) > 20 * depth.tick) {
        const side = (dir) => Array.from({ length: 50 }, (_, i) => [+(mid + dir * (i + 1) * depth.tick).toFixed(6), +(depth.rand() * 8 + 0.05).toFixed(3)]);
        depth.mid = mid;
        depth.bids = side(-1);
        depth.asks = side(1);
        depth.seq += 2;
        datafeed.pushDepth({ firstUpdateId: depth.seq, finalUpdateId: depth.seq, bids: [], asks: [] }, symbol);
        return;
      }
      const bids = [], asks = [];
      for (let k = 0; k < 4; k++) {
        const side = depth.rand() < 0.5 ? 'bids' : 'asks';
        const levels = depth[side];
        const i = Math.floor(depth.rand() * levels.length);
        levels[i] = [levels[i][0], depth.rand() < 0.12 ? 0 : +(depth.rand() * 8 + 0.05).toFixed(3)];
        (side === 'bids' ? bids : asks).push(levels[i]);
      }
      depth.seq += 1;
      datafeed.pushDepth({ firstUpdateId: depth.seq, finalUpdateId: depth.seq, bids, asks }, symbol);
    }

    await Promise.all([document.fonts.load('12px "Geist"'), document.fonts.load('12px "Geist Mono"')]).catch(() => {});

    // ---------------- chart + paging datafeed ----------------
    const canvas = $('chart');
    const stage = $('stage');
    const frames = createFrameScheduler(window, (update) => chart.batch(update));
    // WebGL2 draws the candles and heatmap as instanced quads (2D fallback when unavailable); ?renderer=canvas2d compares.
    const requestedRenderer = new URLSearchParams(location.search).get('renderer') === 'canvas2d' ? 'canvas2d' : 'webgl2';
    const { chart, datafeed } = createDatafeedChart({
      container: canvas,
      renderer: requestedRenderer,
      preset: 'bloxwapDark',
      animation: { scheduler: frames, duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 240 },
      config: defineConfig({
        watermark: { visible: true, text: 'BLOXWAP', opacity: 0.06 },
        statusLine: { visible: true, countdown: true },
        // Like bloxwap.pro: the mark and last lines below replace the built-in last-price line (its axis label stays).
        priceAxis: { lines: { lastPrice: false } },
        formatters: { price: (value) => value.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) },
        // The heatmap paints the retained depth history behind the candles (same depth channel); off by default,
        // Settings → Liquidity heatmap turns it on in the bloxwapDark palette.
        heatmap: { enabled: false },
      }),
      fetchBars: (request) => (request.symbol === COIN ? fetchHyperliquid(request) : fetchSynthetic(request)),
      fetchDepthSnapshot: (request) => (request.symbol === COIN ? fetchHyperliquidDepth(request) : fetchSynthDepth(request.symbol)),
      // Ticks fold as they arrive; their bars reach the chart once per frame, in the same batch as pointer work.
      scheduler: frames,
      onError: (error) => console.warn('chart data:', error),
    });

    // ---------------- footprint: the trade tape → cells, delta and CVD sub-panes ----------------
    // The source follows the datafeed's session (a symbol switch replaces the store), so the
    // series and the indicators never hold a stale tape. Registered once; the settings toggle selects them.
    const footprintSource = datafeedFootprintSource(datafeed);
    chart.registerSeries('footprint', createFootprintSeries(footprintSource));
    chart.indicators.register(createDeltaIndicator(footprintSource));
    chart.indicators.register(createCvdIndicator(footprintSource));

    let footprintOn = false, footprintIds = [], prevSeriesType = null;
    // Binance futures aggTrade: p price, q qty, T trade time (ms), m = buyer is maker → the aggressor sold.
    let tradeWs = null, tradeRetry = null, tradeDelay = 1000, tradeFrame = null;
    function connectTrades() {
      if (tradeWs) return;
      const socket = tradeWs = new WebSocket('wss://fstream.binance.com/ws/btcusdt@aggTrade');
      socket.onopen = () => { tradeDelay = 1000; };
      socket.onmessage = (event) => {
        const m = JSON.parse(event.data);
        if (m.p === undefined) return;
        datafeed.pushTrade({ time: m.T, price: +m.p, size: +m.q, side: m.m ? 'sell' : 'buy' }, COIN);
        // pushTrade only fills the store; repaint at most once per frame, like the folded tick bars.
        tradeFrame ??= frames.request(() => { tradeFrame = null; chart.render(); });
      };
      socket.onclose = () => {
        if (tradeWs !== socket) return;
        tradeWs = null;
        tradeRetry = setTimeout(syncTradeFeed, tradeDelay = Math.min(tradeDelay * 2, 30_000));
      };
    }
    function disconnectTrades() {
      clearTimeout(tradeRetry);
      if (tradeFrame !== null) { frames.cancel(tradeFrame); tradeFrame = null; }
      const socket = tradeWs;
      tradeWs = null;
      socket?.close();
    }
    function syncTradeFeed() {
      if (live && footprintOn && datafeed.symbol === COIN) connectTrades(); else disconnectTrades();
    }
    function setFootprint(on) {
      if (on === footprintOn) return;
      footprintOn = on;
      if (on) {
        prevSeriesType = chart.getConfig().series.type;
        chart.updateConfig({ series: { type: 'footprint' } });
        footprintIds = [chart.addIndicator({ name: 'delta' }), chart.addIndicator({ name: 'cvd' })];
      } else {
        chart.updateConfig({ series: { type: prevSeriesType ?? 'candlestick' } });
        for (const id of footprintIds) chart.removeIndicator(id);
        footprintIds = [];
      }
      footprintItem.classList.toggle('cts-active', on);
      footprintItem.setAttribute('aria-checked', String(on));
      syncTradeFeed();
    }

    // ---------------- mark (live mid) and last (previous close) price lines, as bloxwap.pro draws them ----------------
    let markLine = null, lastLine = null;
    const lastLineColor = () => (document.body.classList.contains('light') ? 'rgba(19, 23, 34, 0.55)' : 'rgba(255, 255, 255, 0.6)');
    // The mark (live mid) line is off by default (settings → Mark price line): its badge covered the chart's own
    // current-price label, which now shows alone.
    let markOn = false, markPrice = null;
    function setMarkLine(price) {
      markPrice = price;
      if (!markOn) return;
      if (markLine) markLine.applyOptions({ price });
      else markLine = chart.series.createPriceLine({ price, color: '#35b5ff', lineWidth: 1, lineStyle: 'dashed' }); // untitled: just the price on the axis
    }
    // The previous close ("last") is off by default (settings → Last close line): its badge sits under the mark's.
    let lastOn = false, lastPrice = null;
    function setLastLine(price) {
      lastPrice = price;
      if (!lastOn) return;
      if (lastLine) lastLine.applyOptions({ price });
      else lastLine = chart.series.createPriceLine({ price, color: lastLineColor(), lineWidth: 1, lineStyle: 'dotted', title: 'last' });
    }
    function clearLines() {
      markLine?.remove(); lastLine?.remove();
      markLine = lastLine = lastPrice = markPrice = null;
    }
    // ---------------- visible-range volume profile: sell volume left, buy volume right, floating past the last bar ----------------
    // Theme tokens by default: buy bars and sizes take the up color, sell bars and sizes the down color (bars as a
    // dim tint behind the vivid numbers), the POC outline the theme text color, so the profile follows dark/light.
    // Bars and shading tween on the frame scheduler.
    const PROFILE = {
      width: 200, inset: 48, scheduler: frames,
      duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 180,
    };
    // ---------------- right-edge panel: the volume profile, the full order book, or neither (one at a time) ----------------
    // The full live order book: a ladder growing out of the price axis over the plot's right edge, every level the
    // depth channel below delivers. Its spread label reads Hyperliquid's full-precision best bid/offer, since the
    // levels themselves are aggregated to the timeframe (walk symbols fall back to the gap between levels).
    const BOOK = {
      placement: 'overlay', layout: 'ladder', inset: 0, width: 160, maxLevels: 100,
      spread: () => (datafeed.symbol === COIN && hlBbo !== null ? hlBbo.ask - hlBbo.bid : null),
    };
    let profile = attachRangeProfile(chart, PROFILE), book = null;
    const sideMode = () => (profile !== null ? 'profile' : book !== null ? 'book' : 'none');
    function setSideMode(mode) {
      if (mode === 'profile' && profile === null) profile = attachRangeProfile(chart, PROFILE);
      if (mode !== 'profile' && profile !== null) {
        profile.remove();
        profile = null;
      }
      if (mode === 'book' && book === null) book = attachInlineBook(chart, BOOK);
      if (mode !== 'book' && book !== null) {
        book.remove();
        book = null;
      }
      clearSideSpace();
      syncSideMode();
    }
    /** Leaves room past the latest bar so the panel floats in whitespace rather than over the newest candles. */
    function clearSideSpace() {
      if (chart.dataLength === 0) return;
      const mode = sideMode();
      const px = (mode === 'profile' ? PROFILE.width + PROFILE.inset : mode === 'book' ? BOOK.width : 0) + 24;
      chart.scale.scrollTo(chart.dataLength - 1 + Math.ceil(px / chart.scale.barSpacing()));
    }

    chart.subscribeDataLoad((e) => {
      const data = chart.getData();
      // A load shows the latest close; a bucket roll moves the line to the bar that just closed.
      if (e.reason === 'set') {
        clearSideSpace();
        if (data.length > 0) setLastLine(data.at(-1).close);
        else clearLines();
        placeMarkers(data);
      } else if (e.reason === 'append' && data.length > 1) setLastLine(data.at(-2).close);
    });

    // Dark maps to the bloxwapDark colors; light to the stock light theme. Colors only, so settings survive.
    const chartTheme = presetChartTheme('bloxwapDark');

    const safeGet = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
    const safeSet = (key, value) => { try { localStorage.setItem(key, value); } catch { /* storage unavailable */ } };
    const arrowsKey = 'chart-ts:scroll-arrows';
    let arrowsOn = safeGet(arrowsKey) !== 'false';

    // ---------------- snapshot (app code: real globals are fine here) ----------------
    const CAMERA = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg>';
    async function downloadSnapshot() {
      const blob = await chart.toBlob({ type: 'image/png' });
      const url = URL.createObjectURL(blob);
      const link = Object.assign(document.createElement('a'), {
        href: url, download: `${datafeed.symbol ?? 'chart'}-${labelOf(datafeed.intervalMs ?? 0)}-${new Date().toISOString().slice(0, 19)}.png`.replace(/[\s:]+/g, '-'),
      });
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ---------------- drawing toolbar (touch gestures, right-click menus) ----------------
    const toolbar = createDrawingToolbar({ chart, document, canvas, rail: $('tools'), overlay: stage, chartTheme,
      storage: { getItem: safeGet, setItem: safeSet }, scheduler: frames, scrollArrows: arrowsOn,
      // Right-click menus: Settings… opens the settings card or the study's settings (a drawing's opens its style bar).
      // The indicators dialog follows what the menu hides or removes on its own (Chart.subscribeConfigChange).
      contextMenu: {
        onChartSettings: () => settings.open(),
        onIndicatorSettings: (id) => indicators.openSettings(id),
        extraItems: (target) => (target.kind === 'chart' ? [{ label: 'Download snapshot', onClick: () => void downloadSnapshot() }] : []),
      } });
    const { controller, flyouts } = toolbar;

    // ---------------- rail controls, built from the same UI primitives ----------------
    const undoBtn = iconButton(document, 'undo', 'Undo (⌘Z)', 20);
    const redoBtn = iconButton(document, 'redo', 'Redo (⇧⌘Z)', 20);
    undoBtn.addEventListener('click', () => controller.undo());
    redoBtn.addEventListener('click', () => controller.redo());
    const syncHistory = () => { undoBtn.disabled = !controller.history.canUndo; redoBtn.disabled = !controller.history.canRedo; };
    controller.history.onChange(syncHistory);
    syncHistory();

    let live = true;
    const settingsBtn = iconButton(document, 'settings', 'Settings', 20);
    const settingsExtras = el(document, 'div');
    const liveItem = menuItem(document, { label: 'Live feed', tick: true, onClick: () => {
      live = !live;
      liveItem.classList.toggle('cts-active', live);
      liveItem.setAttribute('aria-checked', String(live));
      syncFeed();
    } });
    liveItem.classList.add('cts-active');
    liveItem.setAttribute('role', 'checkbox');
    liveItem.setAttribute('aria-checked', 'true');
    const arrowsItem = menuItem(document, { label: 'Navigation arrows', tick: true, onClick: () => {
      arrowsOn = !arrowsOn;
      toolbar.setScrollArrows(arrowsOn);
      safeSet(arrowsKey, String(arrowsOn));
      syncArrowsSetting();
    } });
    function syncArrowsSetting() {
      arrowsItem.classList.toggle('cts-active', arrowsOn);
      arrowsItem.setAttribute('aria-checked', String(arrowsOn));
    }
    arrowsItem.setAttribute('role', 'checkbox');
    syncArrowsSetting();
    const heatmapItem = menuItem(document, { label: 'Liquidity heatmap', tick: true, onClick: () => {
      chart.updateConfig({ heatmap: { enabled: !chart.getConfig().heatmap.enabled } });
      syncHeatmapSetting();
    } });
    function syncHeatmapSetting() {
      const enabled = chart.getConfig().heatmap.enabled;
      heatmapItem.classList.toggle('cts-active', enabled);
      heatmapItem.setAttribute('aria-checked', String(enabled));
    }
    heatmapItem.setAttribute('role', 'checkbox');
    syncHeatmapSetting();
    // The right-edge panel's settings items toggle their panel (switching the other off); the rail disclosure picks one.
    const profileItem = menuItem(document, { label: 'Volume profile', tick: true,
      onClick: () => setSideMode(sideMode() === 'profile' ? 'none' : 'profile') });
    profileItem.setAttribute('role', 'checkbox');
    const markItem = menuItem(document, { label: 'Mark price line', tick: true, onClick: () => {
      markOn = !markOn;
      if (markOn && markPrice !== null) setMarkLine(markPrice);
      if (!markOn) { markLine?.remove(); markLine = null; }
      markItem.classList.toggle('cts-active', markOn);
      markItem.setAttribute('aria-checked', String(markOn));
    } });
    markItem.setAttribute('role', 'checkbox');
    markItem.setAttribute('aria-checked', 'false');
    const lastItem = menuItem(document, { label: 'Last close line', tick: true, onClick: () => {
      lastOn = !lastOn;
      if (lastOn && lastPrice !== null) setLastLine(lastPrice);
      if (!lastOn) { lastLine?.remove(); lastLine = null; }
      lastItem.classList.toggle('cts-active', lastOn);
      lastItem.setAttribute('aria-checked', String(lastOn));
    } });
    lastItem.setAttribute('role', 'checkbox');
    lastItem.setAttribute('aria-checked', 'false');
    const bookItem = menuItem(document, { label: 'Order book', tick: true,
      onClick: () => setSideMode(sideMode() === 'book' ? 'none' : 'book') });
    bookItem.setAttribute('role', 'checkbox');
    // The backend is fixed at creation, so switching reloads with the other ?renderer.
    const glActive = chart.renderBackend === 'webgl2';
    const glItem = menuItem(document, {
      label: requestedRenderer === 'webgl2' && !glActive ? 'WebGL2 renderer (unavailable)' : 'WebGL2 renderer',
      tick: true,
      onClick: () => {
        const url = new URL(location.href);
        if (requestedRenderer === 'webgl2') url.searchParams.set('renderer', 'canvas2d');
        else url.searchParams.delete('renderer');
        location.replace(url);
      },
    });
    glItem.setAttribute('role', 'checkbox');
    glItem.classList.toggle('cts-active', glActive);
    glItem.setAttribute('aria-checked', String(glActive));
    const footprintItem = menuItem(document, { label: 'Footprint + delta/CVD', tick: true, onClick: () => setFootprint(!footprintOn) });
    footprintItem.setAttribute('role', 'checkbox');
    footprintItem.setAttribute('aria-checked', 'false');
    settingsExtras.append(liveItem, arrowsItem, markItem, lastItem, profileItem, bookItem, heatmapItem, footprintItem, glItem, menuSeparator(document), menuLabel(document, 'Datasets'));
    const DATASETS = [
      { label: 'BTC perpetual · Hyperliquid', symbol: COIN, intervalMs: null }, // keeps the current timeframe
      { label: 'Random walk · 1m', symbol: WALK, intervalMs: 60_000 },
      { label: 'Random walk · 1d', symbol: WALK, intervalMs: 86_400_000 },
      { label: 'Gaps (1h) · continuous time', symbol: GAPS, intervalMs: 3_600_000 },
    ];
    for (const d of DATASETS) settingsExtras.append(menuItem(document, { label: d.label, onClick: () => { settings.close(); void load(d.symbol, d.intervalMs ?? datafeed.intervalMs ?? 900_000); } }));

    // The bar-close countdown repaints once a second while it shows, in the same frame as pointer work.
    let countdownTicker;
    const syncCountdown = () => {
      const { statusLine, priceAxis } = chart.getConfig();
      const shown = statusLine.countdown || priceAxis.labels.countdown;
      if (shown && !countdownTicker) countdownTicker = startCountdownTicker({ chart, window, scheduler: frames });
      if (!shown && countdownTicker) { countdownTicker.stop(); countdownTicker = undefined; }
    };
    // Like the header and the indicators dialog, the ticker and the status-line symbol follow every rendered
    // change (the settings card, its Reset defaults, host code) through Chart.subscribeConfigChange.
    chart.subscribeConfigChange(({ keys }) => {
      if (keys.includes('statusLine') || keys.includes('priceAxis')) syncCountdown();
      if (keys.includes('statusLine')) syncStatusSymbol();
      if (keys.includes('heatmap')) syncHeatmapSetting();
    });
    const settings = createChartSettings({ chart, document, trigger: settingsBtn, extraContent: settingsExtras, chartTheme,
      onOpen: () => { toolbar.cancelNavigation(); flyouts.close(); indicators.close(); },
      onChange: () => { toolbar.cancelNavigation(); toolbar.refreshViewport(); },
    });
    syncCountdown();
    // One popover at a time: each dialog closes the other (and any flyout) as it opens.
    const indicators = createIndicatorsDialog({ chart, document,
      onOpen: () => { toolbar.cancelNavigation(); flyouts.close(); settings.close(); },
      onChange: () => { toolbar.cancelNavigation(); toolbar.refreshViewport(); },
    });

    // ---------------- rail: the right-edge panel disclosure (createControlRail below holds the header's controls) ----------------
    // Flyouts open to the right of the rail.
    const railMenu = (label) => {
      const menu = flyouts.create();
      menu.append(menuLabel(document, label));
      return menu;
    };
    const radio = (menu, options) => {
      const item = menuItem(document, { tick: true, ...options, onClick: () => { flyouts.close(); options.onClick(); } });
      item.setAttribute('role', 'menuitemradio');
      menu.append(item);
      return item;
    };
    const check = (item, on) => {
      item.classList.toggle('cts-active', on);
      item.setAttribute('aria-checked', String(on));
    };

    // Right-edge panel disclosure: the volume profile (both ways from a center line), the order book (out of the
    // right edge), or none. The button shows the chosen panel's glyph and takes the accent while one shows.
    const SIDE_MODES = [
      { mode: 'profile', icon: 'range-profile', label: 'Volume profile' },
      { mode: 'book', icon: 'order-book', label: 'Order book' },
      { mode: 'none', icon: 'eye-off', label: 'None' },
    ];
    const sideBtn = iconButton(document, 'range-profile', 'Right-edge panel', 20);
    const sideMenu = railMenu('Right edge');
    const sideItems = SIDE_MODES.map(({ mode, icon, label }) => radio(sideMenu, { icon, label, onClick: () => setSideMode(mode) }));
    flyouts.attach(sideBtn, sideMenu);
    function syncSideMode() {
      const mode = sideMode();
      const current = SIDE_MODES.find((m) => m.mode === mode);
      setButtonIcon(sideBtn, mode === 'none' ? 'range-profile' : current.icon, 20);
      sideBtn.classList.toggle('cts-on', mode !== 'none');
      sideBtn.title = `Right edge: ${current.label}`;
      sideBtn.setAttribute('aria-label', sideBtn.title);
      SIDE_MODES.forEach((m, i) => check(sideItems[i], m.mode === mode));
      check(profileItem, mode === 'profile');
      check(bookItem, mode === 'book');
    }
    syncSideMode();

    // ---------------- header (narrow screens): symbol, timeframes → datafeed, chart type, indicators, scale toggles ----------------
    const shotBtn = iconButton(document, 'image', 'Download snapshot', 18);
    shotBtn.innerHTML = CAMERA;
    shotBtn.addEventListener('click', () => void downloadSnapshot());
    const headerControls = el(document, 'div', 'app-header-controls');
    headerControls.append(shotBtn);
    // Timeframe picks go through `load`, which falls back to the random walk when Hyperliquid is unreachable.
    const source = {
      setSymbol: (symbol, intervalMs) => load(symbol, intervalMs),
      get symbol() { return datafeed.symbol; },
      get intervalMs() { return datafeed.intervalMs; },
      subscribeState: (listener) => datafeed.subscribeState(listener),
    };
    const header = createChartHeader({ chart, document, container: $('header'), datafeed: source, flyouts,
      intervalMs: 900_000, tokens: BLOXWAP_HEADER_THEME,
      onIndicators: () => indicators.openPicker(),
      slots: { right: [headerControls] },
    });
    // Wide: the control rail replaces the header, driving the same source. Host controls join its slots below.
    const controlRail = createControlRail({ chart, document, container: $('ctrl-rail'), datafeed: source, flyouts,
      onIndicators: () => indicators.openPicker(),
      slots: { top: [sideBtn, el(document, 'div', 'cts-rail-divider')] },
    });

    // Embeds can pin a host theme with ?lockedTheme=dark (or light). Without a saved choice, start on dark (bloxwapDark).
    const themeKey = 'chart-ts:theme';
    const requestedLock = new URLSearchParams(location.search).get('lockedTheme');
    const lockedTheme = ['dark', 'light'].includes(requestedLock) ? requestedLock : undefined;
    const savedTheme = safeGet(themeKey);
    const themeControl = createThemeControl({ document, flyouts, lockedTheme,
      theme: ['light', 'dark', 'system'].includes(savedTheme) ? savedTheme : 'dark',
      onSelect: mode => safeSet(themeKey, mode),
      onChange: theme => {
        document.body.classList.toggle('light', theme === 'light');
        controlRail.setTheme(theme);
        toolbar.setTheme(theme);
        settings.setTheme(theme);
        header.setTheme(theme);
        lastLine?.applyOptions({ color: lastLineColor() });
        placeMarkers(chart.getData()); // in the theme's candle colors
        indicators.setTheme(theme); // after the toolbar, so candle-following colors in open settings match
      },
    });

    const railToggle = iconButton(document, 'panel-left-close', 'Hide drawing toolbar', 20);
    railToggle.setAttribute('aria-controls', 'tools');
    railToggle.setAttribute('aria-expanded', 'true');
    railToggle.addEventListener('click', () => {
      const tools = $('tools');
      const show = tools.classList.contains('collapsed');
      flyouts.close();
      toolbar.cancelNavigation();
      tools.classList.toggle('collapsed', !show);
      tools.inert = !show;
      tools.setAttribute('aria-hidden', String(!show));
      railToggle.setAttribute('aria-expanded', String(show));
      setButtonIcon(railToggle, show ? 'panel-left-close' : 'panel-left-open', 20);
      railToggle.title = show ? 'Hide drawing toolbar' : 'Show drawing toolbar';
    });

    // Wide: the control rail replaces the header. Narrow (< 600px): the rail hides, the header shows, and the
    // shared buttons join it, compacting and wrapping. The rail-only controls stay put in the hidden rail.
    const narrow = matchMedia('(max-width: 599px)');
    const themeDivider = el(document, 'div', 'cts-rail-divider');
    const placeControls = () => {
      const theme = themeControl.element ? [themeControl.element] : [];
      flyouts.close();
      if (narrow.matches) headerControls.append(shotBtn, undoBtn, redoBtn, ...theme, settingsBtn, railToggle);
      else {
        controlRail.slots.top.append(undoBtn, redoBtn, ...(theme.length > 0 ? [themeDivider, ...theme] : []));
        controlRail.slots.bottom.append(shotBtn, settingsBtn, railToggle);
      }
    };
    placeControls();
    narrow.addEventListener('change', placeControls);
    // Keep the chart usable in a narrow embed; drawing tools are one click away.
    if (narrow.matches) railToggle.click();

    // ---------------- sizing ----------------
    const fullTimeFormatter = chart.getConfig().formatters.time;
    const shortTimeFormatter = (seconds) => {
      const iso = new Date(seconds * 1000).toISOString();
      return (datafeed.intervalMs ?? 0) >= 86_400_000 ? iso.slice(5, 10) : iso.slice(11, 16);
    };
    const resize = () => {
      toolbar.cancelNavigation();
      const compact = stage.clientWidth < 560;
      chart.batch(() => {
        chart.updateConfig({
          timeAxis: { tickCount: compact ? 2 : 6 },
          priceAxis: { tickCount: compact ? 3 : 6 },
          formatters: { time: compact ? shortTimeFormatter : fullTimeFormatter },
        });
        chart.resize(stage.clientWidth, stage.clientHeight, window.devicePixelRatio || 1);
      });
      toolbar.refreshViewport();
    };
    new ResizeObserver(resize).observe(stage);
    resize();
    window.addEventListener('pagehide', () => toolbar.cancelNavigation());
    window.addEventListener('blur', () => toolbar.cancelNavigation());

    // ---------------- feed status, status-line symbol ----------------
    const status = $('feed-status');
    let notice = null;
    const showStatus = () => {
      const text = notice ?? (datafeed.loading ? 'Loading history…' : '');
      if (text) status.textContent = text;
      status.classList.toggle('shown', text !== '');
    };
    const flash = (text) => {
      notice = text;
      showStatus();
      setTimeout(() => { if (notice === text) { notice = null; showStatus(); } }, 4000);
    };
    // Also re-applied after any status-line write (above), e.g. the settings card's Reset defaults, which restores the status line it started with.
    function syncStatusSymbol() {
      const { symbol, intervalMs } = datafeed;
      if (symbol === null || intervalMs === null) return;
      const text = symbol === COIN ? `${COIN}-PERP · ${labelOf(intervalMs)} · Hyperliquid` : `${symbol} · ${labelOf(intervalMs)} · synthetic`;
      if (chart.getConfig().statusLine.symbol !== text) chart.updateConfig({ statusLine: { symbol: text } });
    }
    datafeed.subscribeState(() => { showStatus(); syncStatusSymbol(); });

    // Two demo markers on the latest swing low and high (time-anchored, so paging history keeps them in place).
    function placeMarkers(data) {
      if (data.length < 120) { chart.series.setMarkers([]); return; }
      const extreme = (from, to, pick) => data.slice(from, to).reduce((a, c) => (pick(c) > pick(a) ? c : a));
      const low = extreme(data.length - 120, data.length - 60, (c) => -c.low);
      const high = extreme(data.length - 60, data.length - 10, (c) => c.high);
      const { upColor, downColor } = chart.getConfig().series;
      chart.series.setMarkers([
        { time: low.time, position: 'belowBar', shape: 'arrowUp', color: upColor, text: 'Buy' },
        { time: high.time, position: 'aboveBar', shape: 'arrowDown', color: downColor, text: 'Sell' },
      ]);
    }

    // ---------------- live mids: Hyperliquid allMids, or random-walk ticks ----------------
    // The datafeed folds each tick into its bucket at once and applies the bars on the next frame (scheduler: frames);
    // the mark line follows the latest mid in that same frame. A hidden tab gets no frames: it catches up in one batch.
    let mid = null, markFrame = null;
    function onMid(price, symbol) {
      if (!live || !(price > 0)) return;
      datafeed.pushTick(price, symbol);
      if (symbol !== datafeed.symbol) return;
      mid = price;
      markFrame ??= frames.request(() => { markFrame = null; setMarkLine(mid); });
    }

    let ws = null, wsRetry = null, wsDelay = 1000;
    function connectFeed() {
      if (ws) return;
      const socket = ws = new WebSocket('wss://api.hyperliquid.xyz/ws');
      socket.onopen = () => {
        wsDelay = 1000;
        socket.send(JSON.stringify({ method: 'subscribe', subscription: { type: 'allMids' } }));
      };
      socket.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.channel === 'allMids') onMid(Number(message.data?.mids?.[COIN]), COIN);
      };
      socket.onclose = () => {
        if (ws !== socket) return;
        ws = null;
        wsRetry = setTimeout(syncFeed, wsDelay = Math.min(wsDelay * 2, 30_000)); // reconnect while still wanted, backing off
      };
    }
    function disconnectFeed() {
      clearTimeout(wsRetry);
      const socket = ws;
      ws = null;
      socket?.close();
    }
    // ---------------- live depth: Hyperliquid l2Book for BTC, synthetic deltas for the walks ----------------
    let depthWs = null, depthRetry = null, depthDelay = 1000;
    function connectDepth(figs) {
      if (depthWs?.figs === figs) return;
      // A new precision needs its own subscription; the old socket's pushes and close are ignored.
      const stale = depthWs;
      const socket = depthWs = new WebSocket('wss://api.hyperliquid.xyz/ws');
      stale?.close();
      socket.figs = figs;
      socket.onopen = () => {
        depthDelay = 1000;
        socket.send(JSON.stringify({ method: 'subscribe', subscription: { type: 'l2Book', coin: COIN, nSigFigs: figs } }));
        socket.send(JSON.stringify({ method: 'subscribe', subscription: { type: 'l2Book', coin: COIN, nSigFigs: figs - 1 } }));
        socket.send(JSON.stringify({ method: 'subscribe', subscription: { type: 'bbo', coin: COIN } }));
      };
      socket.onmessage = (event) => {
        if (depthWs !== socket) return;
        const message = JSON.parse(event.data);
        if (message.channel === 'l2Book' && message.data?.coin === COIN) onHyperliquidBook(message.data, figs);
        else if (message.channel === 'bbo' && message.data?.coin === COIN) {
          const [bid, ask] = message.data.bbo;
          hlBbo = bid && ask ? { bid: +bid.px, ask: +ask.px } : null;
        }
      };
      socket.onclose = () => {
        if (depthWs !== socket) return;
        depthWs = null;
        hlBook = hlFine = hlCoarse = hlBbo = null; // pushes are missed while disconnected: the next one resyncs the book
        depthRetry = setTimeout(syncDepthFeed, depthDelay = Math.min(depthDelay * 2, 30_000));
      };
    }
    function disconnectDepth() {
      clearTimeout(depthRetry);
      const socket = depthWs;
      depthWs = null;
      if (socket) hlBook = hlFine = hlCoarse = hlBbo = null;
      socket?.close();
    }
    let depthTimer = null;
    function syncDepthFeed() {
      const symbol = datafeed.symbol;
      if (live && symbol === COIN) connectDepth(hlFigsFor(datafeed.intervalMs ?? 900_000)); else disconnectDepth();
      const synth = live && symbol !== null && symbol !== COIN;
      if (synth && depthTimer === null) depthTimer = setInterval(() => synthDepthDelta(datafeed.symbol), 250);
      if (!synth && depthTimer !== null) { clearInterval(depthTimer); depthTimer = null; }
    }

    // The walk steps from its own last price: a hidden tab's bars reach the chart only once it shows again.
    let walkTimer = null, walkPrice = null;
    function syncFeed() {
      const symbol = datafeed.symbol;
      if (live && symbol === COIN) connectFeed(); else disconnectFeed();
      const walking = live && symbol !== null && symbol !== COIN;
      if (walking && walkTimer === null) walkTimer = setInterval(() => {
        walkPrice ??= chart.getData().at(-1)?.close ?? null;
        if (walkPrice === null) return;
        walkPrice = Math.max(1, walkPrice + (Math.random() - 0.5) * walkStep(datafeed.intervalMs ?? 0));
        onMid(walkPrice, datafeed.symbol);
      }, 1000);
      if (!walking && walkTimer !== null) { clearInterval(walkTimer); walkTimer = null; }
      syncDepthFeed(); // depth deltas for the loaded symbol; the datafeed ignores any other
      syncTradeFeed(); // aggTrades while the footprint shows; ignored for any other symbol
    }
    window.addEventListener('pagehide', () => { disconnectFeed(); disconnectDepth(); disconnectTrades(); });

    // ---------------- loading: Hyperliquid first, the random walk when it is unreachable ----------------
    async function load(symbol, intervalMs) {
      toolbar.cancelNavigation();
      if (markFrame !== null) { frames.cancel(markFrame); markFrame = null; } // the datafeed drops its own queued bars
      if (symbol !== datafeed.symbol) clearLines();
      const gaps = symbol === GAPS;
      if (chart.getConfig().timeScale.continuous !== gaps) chart.updateConfig({ timeScale: { continuous: gaps } });
      await datafeed.setSymbol(symbol, intervalMs);
      if (datafeed.symbol !== symbol || datafeed.intervalMs !== intervalMs) return; // superseded
      if (symbol === COIN && datafeed.error !== null && chart.dataLength === 0) {
        flash('Hyperliquid is unreachable · showing a random walk');
        return load(WALK, intervalMs);
      }
      walkPrice = null; // the walk resumes from the loaded history's last close
      syncFeed(); // mids for the loaded symbol; the datafeed ignores ticks for any other
    }

    // QA hook: what the chart holds, checked bucket by bucket.
    window.__chartStats = () => {
      const data = chart.getData(), step = (datafeed.intervalMs ?? 0) / 1000;
      let duplicates = 0, missingBuckets = 0;
      for (let i = 1; i < data.length; i++) {
        const gap = data[i].time - data[i - 1].time;
        if (gap <= 0) duplicates++;
        else if (step > 0) missingBuckets += Math.round(gap / step) - 1;
      }
      const { symbol, intervalMs, loading, exhausted, error } = datafeed.state;
      const book = chart.depth;
      return { symbol, intervalMs, bars: data.length, duplicates, missingBuckets, exhausted, loading,
        renderBackend: chart.renderBackend, bookLevels: book === null ? null : { bids: book.bids.length, asks: book.asks.length },
        error: error === null ? null : String(error), firstTime: data[0]?.time ?? null, lastTime: data.at(-1)?.time ?? null };
    };

    await load(COIN, 900_000);

    // ---------------- boot content ----------------
    {
      const data = chart.getData(), n = data.length;
      if (n >= 120) {
        const lo = data.slice(n - 120, n - 60).reduce((a, c, i) => (c.low < a.p ? { p: c.low, i: n - 120 + i } : a), { p: Infinity, i: 0 });
        const hi = data.slice(n - 60, n - 10).reduce((a, c, i) => (c.high > a.p ? { p: c.high, i: n - 60 + i } : a), { p: -Infinity, i: 0 });
        // On a phone these fill most of the view: a one-finger drag still pans across them, a tap selects one,
        // and only the selected drawing follows a finger.
        chart.addDrawing({ name: 'fib', points: [{ index: lo.i, price: lo.p }, { index: hi.i, price: hi.p }], color: '#787b86' });
        chart.addDrawing({ name: 'long-position', points: [{ index: n - 30, price: data[n - 30].close }, { index: n + 10, price: data[n - 30].close * 1.012 }] });
      }
    }
    Object.assign(window, { chart, datafeed, toolbar, header, controlRail, indicators, settings });
  </script>
</body>
</html>
