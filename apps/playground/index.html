<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>@bloxwap/chart playground</title>
  <style>
    @font-face { font-family: 'Geist'; src: url('../assets/fonts/Geist-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Geist'; src: url('../assets/fonts/Geist-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'Geist Mono'; src: url('../assets/fonts/GeistMono-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Geist Mono'; src: url('../assets/fonts/GeistMono-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    /* The app only lays out regions; toolbar and on-chart styling ship with chart-ts/ui. */
    html, body { margin: 0; height: 100%; background: #0a0a0a; }
    body.light { background: #f5f7fa; }
    #app { display: flex; height: 100vh; }
    #stage { position: relative; flex: 1; min-width: 0; }
    #tools { flex: none; width: 52px; overflow: hidden; transition: width 240ms cubic-bezier(0.2, 0.8, 0.2, 1); }
    #tools.collapsed { width: 0; }
    #tools > nav { transition: transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 180ms ease-out; }
    #tools.collapsed > nav { transform: translateX(-100%); opacity: 0; }
    @media (prefers-reduced-motion: reduce) { #tools, #tools > nav { transition: none; } }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <div id="app">
    <nav id="ctrl-rail" class="cts-theme cts-rail" aria-label="Chart controls">
      <div class="cts-rail-scroll" id="ctrl-scroll"></div>
      <div id="ctrl-bottom" class="cts-rail-footer" style="display: flex; flex-direction: column; gap: 4px;"></div>
    </nav>
    <div id="tools"></div>
    <div id="stage"><canvas id="chart"></canvas></div>
  </div>

  <script type="module">
    import { createChart, defineConfig } from '../dist/index.js';
    import {
      createDrawingToolbar, createChartSettings, createFrameScheduler, attachScrollableRail, el, iconButton, labelButton, setButtonLabel, setButtonIcon, menuItem, menuLabel, menuSeparator,
    } from '../dist/ui/index.js';

    // ---------------- data (deterministic random walk) ----------------
    let seed = 42;
    const next = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    function genWalk(count, intervalSec, { gapChance = 0, startPrice = 100 } = {}) {
      const out = [];
      let price = startPrice;
      let time = Math.floor(Date.now() / 1000) - count * intervalSec;
      const volScale = intervalSec >= 86400 ? 4 : intervalSec >= 3600 ? 1.6 : 0.6;
      for (let i = 0; i < count; i++) {
        time += intervalSec;
        if (gapChance > 0 && next() < gapChance) continue;
        const open = price;
        const close = Math.max(1, open + (next() - 0.48) * volScale);
        out.push({
          time, open, close,
          high: Math.max(open, close) + next() * volScale * 0.4,
          low: Math.min(open, close) - next() * volScale * 0.4,
          volume: Math.round(500 + next() * 4500),
        });
        price = close;
      }
      return out;
    }
    const TIMEFRAMES = [
      { label: '1m', seconds: 60, count: 1500 }, { label: '5m', seconds: 300, count: 1500 },
      { label: '15m', seconds: 900, count: 1500 }, { label: '1h', seconds: 3600, count: 1200 },
      { label: '4h', seconds: 14400, count: 1000 }, { label: '1d', seconds: 86400, count: 500 },
    ];
    const DATA_PRESETS = [
      { label: '1m × 2000', make: () => genWalk(2000, 60) },
      { label: '1d × 500', make: () => genWalk(500, 86400) },
      { label: 'Gaps (1h)', make: () => genWalk(1500, 3600, { gapChance: 0.15 }) },
    ];

    // ---------------- Hyperliquid live feed (BTC perpetual) ----------------
    const COIN = 'BTC';
    const symbolFor = (label) => `${COIN} perpetual · ${label} · Hyperliquid`;
    const toCandle = (k) => ({ time: Math.floor(k.t / 1000), open: +k.o, high: +k.h, low: +k.l, close: +k.c, volume: +k.v });
    const fetchHyperliquid = async (tf) => {
      const res = await fetch('https://api.hyperliquid.xyz/info', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'candleSnapshot', req: { coin: COIN, interval: tf.label, startTime: Date.now() - tf.count * tf.seconds * 1000, endTime: Date.now() } }),
      });
      if (!res.ok) throw new Error(`Hyperliquid candleSnapshot failed: ${res.status}`);
      return (await res.json()).map(toCandle);
    };

    let timeframe = TIMEFRAMES[2];
    let feed = 'live'; // 'live' streams Hyperliquid; 'synthetic' runs the local random walk
    let candles;
    try {
      candles = await fetchHyperliquid(timeframe);
    } catch {
      feed = 'synthetic';
      candles = genWalk(timeframe.count, timeframe.seconds);
    }
    let intervalSeconds = timeframe.seconds;

    await Promise.all([document.fonts.load('12px "Geist"'), document.fonts.load('12px "Geist Mono"')]).catch(() => {});

    // ---------------- chart + the library's drawing toolbar ----------------
    const $ = (id) => document.getElementById(id);
    const canvas = $('chart');
    const stage = $('stage');
    const frames = createFrameScheduler(window, (update) => chart.batch(update));
    const chart = createChart({
      container: canvas,
      animation: { scheduler: frames, duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 240 },
      config: defineConfig({
        data: candles,
        series: { type: 'candlestick', upColor: 'color(display-p3 0 1 0.55)', downColor: 'color(display-p3 1 0.2 0.35)' },
        theme: { fontFamily: "'Geist', system-ui, sans-serif", monoFamily: "'Geist Mono', ui-monospace, monospace", fontSize: 12 },
        watermark: { visible: true, text: 'BLOXWAP', opacity: 0.06, fontFamily: "'Geist'" },
        statusLine: { visible: true, symbol: feed === 'live' ? symbolFor(timeframe.label) : 'Random walk', volume: true },
        formatters: { price: (value) => value.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) },
      }),
    });
    const safeGet = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
    const safeSet = (key, value) => { try { localStorage.setItem(key, value); } catch { /* storage unavailable */ } };
    const arrowsKey = 'chart-ts:scroll-arrows';
    let arrowsOn = safeGet(arrowsKey) !== 'false';
    const toolbar = createDrawingToolbar({ chart, document, canvas, rail: $('tools'), overlay: stage,
      storage: { getItem: safeGet, setItem: safeSet }, scheduler: frames, scrollArrows: arrowsOn });
    const { controller, flyouts } = toolbar;

    // ---------------- app control rail, built from the same UI primitives ----------------
    const divider = () => el(document, 'div', 'cts-rail-divider');
    const loadData = (data) => {
      toolbar.cancelNavigation();
      candles = data;
      intervalSeconds = data.length > 1 ? data[1].time - data[0].time : intervalSeconds;
      chart.setData(candles);
      chart.scale.scrollTo(candles.length - 1);
      toolbar.refreshViewport();
    };

    const tfBtn = labelButton(document, TIMEFRAMES[2].label, 'Timeframe');
    const tfMenu = flyouts.create();
    tfMenu.append(menuLabel(document, 'Timeframe'));
    for (const tf of TIMEFRAMES) {
      tfMenu.append(menuItem(document, {
        label: tf.label, meta: `${tf.count} bars`,
        onClick: async () => {
          setButtonLabel(tfBtn, tf.label); flyouts.close();
          timeframe = tf;
          if (feed === 'live') {
            try {
              loadData(await fetchHyperliquid(tf));
              chart.updateConfig({ statusLine: { symbol: symbolFor(tf.label) } });
              connectFeed();
              return;
            } catch { feed = 'synthetic'; }
          }
          disconnectFeed();
          loadData(genWalk(tf.count, tf.seconds));
          chart.updateConfig({ statusLine: { symbol: 'Random walk' } });
        },
      }));
    }
    flyouts.attach(tfBtn, tfMenu);

    const SERIES_TYPES = [['candlestick', 'Candlestick'], ['line', 'Line'], ['area', 'Area'], ['bar', 'Bar (OHLC)'], ['histogram', 'Histogram']];
    const ctBtn = iconButton(document, 'chart-candlestick', 'Chart type', 20);
    const ctMenu = flyouts.create();
    ctMenu.append(menuLabel(document, 'Chart type'));
    const ctItems = SERIES_TYPES.map(([type, label]) => {
      const item = menuItem(document, {
        icon: `chart-${type}`, label, tick: true,
        onClick: () => {
          chart.updateConfig({ series: { type } });
          for (const it of ctItems) it.classList.toggle('cts-active', it === item);
          setButtonIcon(ctBtn, `chart-${type}`, 20);
          flyouts.close();
        },
      });
      item.classList.toggle('cts-active', type === 'candlestick');
      ctMenu.append(item);
      return item;
    });
    flyouts.attach(ctBtn, ctMenu);

    const INDICATORS = [
      ['sma', 'SMA (20)', { period: 20 }], ['ema', 'EMA (50)', { period: 50 }], ['boll', 'Bollinger bands (20, 2)', {}],
      ['vol', 'Volume', {}], ['macd', 'MACD (12, 26, 9)', {}], ['rsi', 'RSI (14)', {}], ['kdj', 'KDJ (9)', {}],
    ];
    const fxBtn = iconButton(document, 'function-square', 'Indicators', 20);
    const fxMenu = flyouts.create();
    fxMenu.append(menuLabel(document, 'Indicators'));
    const indicatorItems = new Map();
    const syncIndicators = () => {
      const active = new Set(chart.getConfig().indicators.map((i) => i.name));
      for (const [name, item] of indicatorItems) item.classList.toggle('cts-active', active.has(name));
    };
    for (const [name, label, params] of INDICATORS) {
      const item = menuItem(document, {
        label, tick: true,
        onClick: () => {
          const existing = chart.getConfig().indicators.find((i) => i.name === name);
          if (existing) chart.removeIndicator(existing.id);
          else chart.addIndicator({ id: `demo-${name}`, name, params, visible: !controller.indicatorsHidden });
          syncIndicators();
        },
      });
      indicatorItems.set(name, item);
      fxMenu.append(item);
    }
    flyouts.attach(fxBtn, fxMenu);
    controller.on('change', syncIndicators);

    const undoBtn = iconButton(document, 'undo', 'Undo (⌘Z)', 20);
    const redoBtn = iconButton(document, 'redo', 'Redo (⇧⌘Z)', 20);
    undoBtn.addEventListener('click', () => controller.undo());
    redoBtn.addEventListener('click', () => controller.redo());
    const syncHistory = () => { undoBtn.disabled = !controller.history.canUndo; redoBtn.disabled = !controller.history.canRedo; };
    controller.history.onChange(syncHistory);
    syncHistory();

    let light = false;
    const themeBtn = iconButton(document, 'sun', 'Switch to light theme', 20);
    themeBtn.addEventListener('click', () => {
      light = !light;
      document.body.classList.toggle('light', light);
      $('ctrl-rail').classList.toggle('cts-light', light);
      toolbar.setTheme(light ? 'light' : 'dark'); // UI chrome + chart colors together
      settings.setTheme(light ? 'light' : 'dark');
      setButtonIcon(themeBtn, light ? 'moon' : 'sun', 20);
      themeBtn.title = light ? 'Switch to dark theme' : 'Switch to light theme';
    });

    let live = true;
    const settingsBtn = iconButton(document, 'settings', 'Settings', 20);
    const settingsExtras = el(document, 'div');
    const liveItem = menuItem(document, { label: 'Live feed', tick: true, onClick: () => {
      live = !live;
      liveItem.classList.toggle('cts-active', live);
      if (feed === 'live') { if (live) connectFeed(); else disconnectFeed(); }
    } });
    liveItem.classList.add('cts-active');
    const arrowsItem = menuItem(document, { label: 'Navigation arrows', tick: true, onClick: () => {
      arrowsOn = !arrowsOn;
      toolbar.setScrollArrows(arrowsOn);
      safeSet(arrowsKey, String(arrowsOn));
      syncArrowsSetting();
    } });
    function syncArrowsSetting() {
      arrowsItem.classList.toggle('cts-active', arrowsOn);
      arrowsItem.setAttribute('aria-checked', String(arrowsOn));
    }
    arrowsItem.setAttribute('role', 'menuitemcheckbox');
    syncArrowsSetting();
    liveItem.setAttribute('role', 'checkbox');
    liveItem.setAttribute('aria-checked', 'true');
    liveItem.addEventListener('click', () => liveItem.setAttribute('aria-checked', String(live)));
    arrowsItem.setAttribute('role', 'checkbox');
    settingsExtras.append(liveItem, arrowsItem, menuSeparator(document), menuLabel(document, 'Datasets'));
    for (const p of DATA_PRESETS) settingsExtras.append(menuItem(document, { label: p.label, onClick: () => {
      feed = 'synthetic';
      disconnectFeed();
      loadData(p.make());
      chart.updateConfig({ statusLine: { symbol: 'Random walk' } });
    } }));
    const settings = createChartSettings({ chart, document, trigger: settingsBtn, extraContent: settingsExtras,
      onOpen: () => { toolbar.cancelNavigation(); flyouts.close(); },
      onChange: () => { toolbar.cancelNavigation(); toolbar.refreshViewport(); },
    });

    const railToggle = iconButton(document, 'panel-left-close', 'Hide drawing toolbar', 20);
    railToggle.setAttribute('aria-controls', 'tools');
    railToggle.setAttribute('aria-expanded', 'true');
    railToggle.addEventListener('click', () => {
      const tools = $('tools');
      const show = tools.classList.contains('collapsed');
      flyouts.close();
      toolbar.cancelNavigation();
      tools.classList.toggle('collapsed', !show);
      tools.inert = !show;
      tools.setAttribute('aria-hidden', String(!show));
      railToggle.setAttribute('aria-expanded', String(show));
      setButtonIcon(railToggle, show ? 'panel-left-close' : 'panel-left-open', 20);
      railToggle.title = show ? 'Hide drawing toolbar' : 'Show drawing toolbar';
    });

    $('ctrl-scroll').append(tfBtn, ctBtn, fxBtn, divider(), undoBtn, redoBtn, divider(), themeBtn);
    $('ctrl-bottom').append(settingsBtn, railToggle);
    attachScrollableRail(document, $('ctrl-scroll'));

    // Keep the chart usable in a narrow embed; drawing tools are one click away.
    if (window.innerWidth < 600) railToggle.click();

    // ---------------- sizing + live feed ----------------
    const fullTimeFormatter = chart.getConfig().formatters.time;
    const shortTimeFormatter = (seconds) => {
      const iso = new Date(seconds * 1000).toISOString();
      return intervalSeconds >= 86400 ? iso.slice(5, 10) : iso.slice(11, 16);
    };
    const resize = () => {
      toolbar.cancelNavigation();
      const compact = stage.clientWidth < 560;
      chart.batch(() => {
        chart.updateConfig({
          timeAxis: { tickCount: compact ? 2 : 6 },
          priceAxis: { tickCount: compact ? 3 : 6 },
          formatters: { time: compact ? shortTimeFormatter : fullTimeFormatter },
        });
        chart.resize(stage.clientWidth, stage.clientHeight, window.devicePixelRatio || 1);
      });
      toolbar.refreshViewport();
    };
    new ResizeObserver(resize).observe(stage);
    resize();
    window.addEventListener('pagehide', () => toolbar.cancelNavigation());
    window.addEventListener('blur', () => toolbar.cancelNavigation());

    // ---------------- Hyperliquid websocket: live candle updates ----------------
    let ws;
    const disconnectFeed = () => { ws?.close(); ws = undefined; };
    const connectFeed = () => {
      disconnectFeed();
      ws = new WebSocket('wss://api.hyperliquid.xyz/ws');
      ws.onopen = () => ws.send(JSON.stringify({ method: 'subscribe', subscription: { type: 'candle', coin: COIN, interval: timeframe.label } }));
      ws.onmessage = (event) => {
        if (!live) return;
        const message = JSON.parse(event.data);
        if (message.channel !== 'candle' || !message.data) return;
        const candle = toCandle(message.data);
        const last = candles[candles.length - 1];
        if (last && candle.time < last.time) return;
        if (last && candle.time === last.time) candles[candles.length - 1] = candle;
        else candles.push(candle);
        chart.appendData(candle);
      };
    };
    if (feed === 'live') connectFeed();
    window.addEventListener('pagehide', disconnectFeed);

    setInterval(() => {
      if (!live || feed !== 'synthetic' || candles.length === 0) return;
      const last = { ...candles[candles.length - 1] };
      last.close = Math.max(1, last.close + (next() - 0.5) * 1.2);
      last.high = Math.max(last.high, last.close);
      last.low = Math.min(last.low, last.close);
      last.volume += Math.round(next() * 50);
      candles[candles.length - 1] = last;
      chart.appendData(last);
    }, 1000);

    // ---------------- boot content ----------------
    indicatorItems.get('vol').click();
    {
      const n = candles.length;
      const lo = candles.slice(n - 120, n - 60).reduce((a, c, i) => (c.low < a.p ? { p: c.low, i: n - 120 + i } : a), { p: Infinity, i: 0 });
      const hi = candles.slice(n - 60, n - 10).reduce((a, c, i) => (c.high > a.p ? { p: c.high, i: n - 60 + i } : a), { p: -Infinity, i: 0 });
      chart.addDrawing({ name: 'fib', points: [{ index: lo.i, price: lo.p }, { index: hi.i, price: hi.p }], color: '#787b86' });
      chart.addDrawing({ name: 'long-position', points: [{ index: n - 30, price: candles[n - 30].close }, { index: n + 10, price: candles[n - 30].close * 1.012 }] });
    }
    Object.assign(window, { chart, toolbar });
  </script>
</body>
</html>
