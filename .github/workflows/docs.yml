name: Documentation

# Runs on the org Mac mini self-hosted runners. See docs/ci-runners.md.
on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'vendor/**', '.npmrc', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['apps/**', 'packages/**', 'vendor/**', '.npmrc', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    env:
      NEXT_PUBLIC_BASE_PATH: /chart
      NEXT_PUBLIC_SITE_URL: https://bloxwap.github.io
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      # Job-level env cannot use the runner context; RUNNER_TEMP is set by the runner.
      - name: Point temp paths at runner temp
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Chrome for Testing; no --with-deps (that flag installs apt packages on Linux).
      - name: Install Playwright Chrome
        run: npx playwright-core install chrome
      - run: npm run docs:build
      - run: npm run docs:check
      - run: npm run lint
      - run: npm run docs:test
      - name: Check GNU tar
        run: |
          if ! command -v gtar >/dev/null 2>&1; then
            echo '::error::gtar (GNU tar) is required for actions/upload-pages-artifact on macOS. Install with: brew install gnu-tar'
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
