name: Documentation

# Runs on the org Mac mini self-hosted runners. See docs/ci-runners.md.
on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'vendor/**', '.npmrc', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['apps/**', 'packages/**', 'vendor/**', '.npmrc', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    # Release scan, parallel with build. Skipped on PRs.
    if: github.event_name != 'pull_request'
    uses: bloxwap/.github/.github/workflows/security-scan.yml@6755bcc6a591531ae95a5babfa389c329f71ba0b # v1.0.2
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  build:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    env:
      NEXT_PUBLIC_BASE_PATH: /chart
      NEXT_PUBLIC_SITE_URL: https://bloxwap.github.io
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      # Job-level env cannot use the runner context; RUNNER_TEMP is set by the runner.
      - name: Point temp paths at runner temp
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Minis persist ~/.npm on disk. GitHub's remote cache is 0.4–1 MB/s for ~1.4 GB.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      # Hermetic Chrome for Testing into $PLAYWRIGHT_BROWSERS_PATH. `install chrome`
      # is the system Google Chrome channel and needs sudo on macOS.
      - name: Install Playwright Chrome for Testing
        run: npx playwright-core install chrome-for-testing --no-shell
      - run: npm run docs:build
      - run: npm run docs:check
      - run: npm run lint
      - run: npm run docs:test
      # Deploy only runs on main; skip the Pages artifact on PRs after validating the export.
      - name: Check GNU tar
        if: github.event_name != 'pull_request'
        run: |
          if ! command -v gtar >/dev/null 2>&1; then
            echo '::error::gtar (GNU tar) is required for actions/upload-pages-artifact on macOS. Install with: brew install gnu-tar'
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: apps/docs/out

  deploy:
    # Security: never run fork PR code on the self-hosted runner.
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [build, security]
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
