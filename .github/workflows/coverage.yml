name: Coverage

# Runs on the org Mac mini self-hosted runners. See docs/ci-runners.md.
on:
  push:
    branches: [main]
    paths: ['packages/chart/**', 'package.json', 'package-lock.json', '.github/workflows/coverage.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20

    steps:
      # Job-level env cannot use the runner context; RUNNER_TEMP is set by the runner.
      - name: Point TMPDIR at runner temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Minis persist ~/.npm on disk. GitHub's remote cache is 0.4–1 MB/s for ~1.4 GB.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci

      - name: Generate coverage report
        run: |
          npm run coverage:lcov
          test -s packages/chart/coverage/lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/chart/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
