name: Publish to npm

# Publishing a GitHub release publishes @bloxwap/chart at the version in packages/chart/package.json.
# Release flow: bump the version in a PR, merge it, then create a release tagged v<version>.
#
# Only the publish job uses GitHub-hosted Ubuntu: npm trusted publishing and
# provenance require it. See docs/ci-runners.md for the transition and approval gate.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  security:
    # Gate release preparation with the existing self-hosted security scan.
    uses: bloxwap/.github/.github/workflows/security-scan.yml@2a70724cd0d803abef5f5a7c64c46065f4fda19b # v1.1.0
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  prepare:
    needs: security
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.value }}

    steps:
      # Job-level env cannot use the runner context; RUNNER_TEMP is set by the runner.
      - name: Point TMPDIR at runner temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Do not restore dependency caches in the release job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Determine version and npm tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # POSIX / BSD-portable: no jq, no GNU sed, no bashisms.
          VERSION=$(node -p "require('./packages/chart/package.json').version")
          # The private workspace root has no release version; the chart package owns it.
          # A release must be tagged for the version it publishes, or npm and GitHub disagree.
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match packages/chart/package.json version v$VERSION"
            exit 1
          fi
          PRE=${VERSION#*-}
          if [ "$PRE" = "$VERSION" ]; then
            TAG=latest
          else
            case "$PRE" in
              alpha*) TAG=alpha ;;
              beta*) TAG=beta ;;
              rc*) TAG=rc ;;
              *) TAG=prerelease ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          no-cache: true
      - run: bun install --frozen-lockfile

      # Build and run the full Node/Happy DOM suite once before packing.
      - run: npm test

      # Reuse the tested build instead of rebuilding through prepack.
      - name: Pack tested package
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --workspace @bloxwap/chart --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: npm-release
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      # Node 24 includes npm >= 11.5.1, required for OIDC trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: npm-package
      - name: Publish @bloxwap/chart@${{ needs.prepare.outputs.version }}
        env:
          NPM_TAG: ${{ needs.prepare.outputs.tag }}
        run: npm publish ./npm-package/*.tgz --ignore-scripts --access public --tag "$NPM_TAG" --provenance
