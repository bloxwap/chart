name: Publish to npm

# Publishing a GitHub release publishes @bloxwap/chart at the version in packages/chart/package.json.
# Release flow: bump the version in a PR, merge it, then create a release tagged v<version>.
#
# npm trusted publishing does not support self-hosted runners
# (https://docs.npmjs.com/trusted-publishers/). This job authenticates with the
# NPM_TOKEN secret instead. That drops OIDC trusted publishing and
# automatic provenance. See docs/ci-runners.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  security:
    # Single-job publish: adds the scan serially.
    uses: bloxwap/.github/.github/workflows/security-scan.yml@90c5e7f20cef611a83ea7db51f9b85478d714fa6 # v1
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  publish:
    needs: security
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      # Job-level env cannot use the runner context; RUNNER_TEMP is set by the runner.
      - name: Point TMPDIR at runner temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      # Minis persist ~/.npm on disk. GitHub's remote cache is 0.4–1 MB/s for ~1.4 GB.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci

      - name: Determine version and npm tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # POSIX / BSD-portable: no jq, no GNU sed, no bashisms.
          VERSION=$(node -p "require('./packages/chart/package.json').version")
          # The private workspace root has no release version; the chart package owns it.
          # A release must be tagged for the version it publishes, or npm and GitHub disagree.
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match packages/chart/package.json version v$VERSION"
            exit 1
          fi
          PRE=${VERSION#*-}
          if [ "$PRE" = "$VERSION" ]; then
            TAG=latest
          else
            case "$PRE" in
              alpha*) TAG=alpha ;;
              beta*) TAG=beta ;;
              rc*) TAG=rc ;;
              *) TAG=prerelease ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check npm CLI
        run: |
          npm --version
          npx --yes semver -r '>=11.5.1' "$(npm --version)" > /dev/null || npm install -g npm@latest

      # prepack builds and prepublishOnly runs the full test suite before anything is uploaded;
      # publishConfig.access is public. Token publish does not attach provenance.
      - name: Publish @bloxwap/chart@${{ steps.tag.outputs.version }}
        run: npm publish --workspace @bloxwap/chart --tag ${{ steps.tag.outputs.value }}
