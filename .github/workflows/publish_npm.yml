name: Publish to npm

# Publishing a GitHub release publishes @bloxwap/chart at the version in packages/chart/package.json.
# Release flow: bump the version in a PR, merge it, then create a release tagged v<version>.
#
# Only the publish job uses GitHub-hosted Ubuntu: npm trusted publishing and
# provenance require it. See docs/ci-runners.md for the transition and approval gate.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  security:
    # Single-job publish: adds the scan serially.
    uses: bloxwap/.github/.github/workflows/security-scan.yml@2a70724cd0d803abef5f5a7c64c46065f4fda19b # v1.1.0
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  publish:
    needs: security
    runs-on: ubuntu-24.04
    environment: npm-release
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      # Job-level env cannot use the runner context; RUNNER_TEMP is set by the runner.
      - name: Point TMPDIR at runner temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Do not restore dependency caches in the release job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        # Bootstrap a fixed OIDC-capable npm CLI outside the project dependency lockfile.
        run: npm install --global npm@11.6.1 # zizmor: ignore[adhoc-packages]

      - run: npm ci

      - name: Determine version and npm tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # POSIX / BSD-portable: no jq, no GNU sed, no bashisms.
          VERSION=$(node -p "require('./packages/chart/package.json').version")
          # The private workspace root has no release version; the chart package owns it.
          # A release must be tagged for the version it publishes, or npm and GitHub disagree.
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match packages/chart/package.json version v$VERSION"
            exit 1
          fi
          PRE=${VERSION#*-}
          if [ "$PRE" = "$VERSION" ]; then
            TAG=latest
          else
            case "$PRE" in
              alpha*) TAG=alpha ;;
              beta*) TAG=beta ;;
              rc*) TAG=rc ;;
              *) TAG=prerelease ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      # prepack builds and prepublishOnly runs the full Node/Happy DOM test suite;
      # no browser download is needed. publishConfig.access is public.
      - name: Publish @bloxwap/chart@${{ steps.tag.outputs.version }}
        env:
          NPM_TAG: ${{ steps.tag.outputs.value }}
          # Transitional fallback: delete once the npm Trusted Publisher is verified.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace @bloxwap/chart --tag "$NPM_TAG" --provenance
