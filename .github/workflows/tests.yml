name: Tests

# Runs on the org Mac mini self-hosted runners. See docs/ci-runners.md.
# Gates pull requests on the same checks contributors run locally. Job-level filtering lets
# docs-only PRs skip tests successfully, so the test job can remain a required status check.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code == 'true' && 'true' || steps.filter.outputs.docs_markdown }}
    steps:
      # Only PRs skip prose-only changes; all other events run the full test job.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'
              - '!CODEOWNERS'
            # npm ci runs fumadocs-mdx postinstall, so docs content is a build input.
            docs_markdown:
              - 'apps/docs/content/docs/**/*.md'

  test:
    needs: changes
    # Security: never run fork PR code on the self-hosted runner.
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20

    steps:
      # Job-level env cannot use the runner context; RUNNER_TEMP is set by the runner.
      - name: Point TMPDIR at runner temp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Minis persist ~/.npm on disk. GitHub's remote cache is 0.4–1 MB/s for ~1.4 GB.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci

      # Builds icons, WASM and TypeScript, compiles the tests, runs the suite, and fails if any
      # file drops below 100% line/branch/function coverage.
      - name: Tests and coverage gate
        run: npm run coverage

      # Tests import dist/ directly, so check the published entry points separately: every
      # "exports" subpath must import by package name in plain Node.
      - name: Package entry points
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const { name, exports } = JSON.parse(readFileSync('packages/chart/package.json', 'utf8'));
            for (const key of Object.keys(exports)) await import(key === '.' ? name : name + key.slice(1));
            console.log('imported', Object.keys(exports).length, 'entry points');
          "
