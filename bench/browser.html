<!doctype html>
<meta charset="utf-8">
<title>chart-ts browser CPU benchmark</title>
<button id="run">Run benchmark</button>
<pre id="result">Real canvas; 100k stored candles; five samples per workload. Measures CPU submission time, not compositor FPS.</pre>
<script type="module">
  import { runBrowserBenchmark } from './browser.bench.mjs';
  const button = document.querySelector('#run');
  button.onclick = async () => {
    button.disabled = true;
    const result = document.querySelector('#result');
    result.textContent = 'Running…';
    try { result.textContent = JSON.stringify(await runBrowserBenchmark(), null, 2); }
    catch (error) { result.textContent = String(error); }
    finally { button.disabled = false; }
  };
</script>
